name: Iradex beta feedback
description: Report an alpha issue or share a product observation
title: "[Beta feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Iradex. Do not attach private proof photos, commitments, phone numbers or other sensitive information.
  - type: input
    id: device
    attributes:
      label: Phone model
      placeholder: Samsung Galaxy A05
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area tested
      options:
        - Onboarding and permissions
        - Creating a commitment
        - Scheduled alarm
        - Alarm after phone restart
        - Photo proof
        - Progress note
        - Progress and history
        - Navigation or visual design
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocked me completely
        - Made the task difficult
        - Minor issue
        - Product suggestion
        - Positive feedback
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm that this report contains no private proof or sensitive personal information.
          required: true
